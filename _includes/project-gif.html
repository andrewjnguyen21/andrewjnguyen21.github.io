{% assign demo = include.demo %}
{% capture poster %}{{ '/assets/images/projects/' | append: demo.file | append: '.jpg' | relative_url }}{% endcapture %}
<div class="project-gif-frame{% if include.cover %} project-media{% endif %}{% if demo.shape %} project-gif-{{ demo.shape }}{% endif %}">
  <img src="{{ poster }}" alt="{{ demo.description | escape }}" width="{% if demo.shape == 'portrait' %}253{% else %}800{% endif %}" height="{% if demo.shape == 'square' %}800{% else %}450{% endif %}" loading="lazy">
  <video class="project-demo" muted loop playsinline preload="none" aria-label="{{ demo.description | escape }}" poster="{{ poster }}"><source src="{{ '/assets/videos/projects/' | append: demo.file | append: '.mp4' | relative_url }}" type="video/mp4"></video>
</div>
