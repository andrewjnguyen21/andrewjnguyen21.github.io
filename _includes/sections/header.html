<nav class="main-header">
  <ul>
    {% for link in site.data.navigation.main %}
    <li><a href="{{ link.url | relative_url }}">{{ link.title }}</a></li>
    {% endfor %}
  </ul>
</nav>

<style>
  .main-header {
    display: flex;
    justify-content: space-between; /* Pushes name left, nav right */
    align-items: center;           /* Perfectly centers them vertically */
    max-width: 1000px;             /* MATCH THIS to your main content width */
    margin: 0 auto;                /* Centers the header on the page */
    padding: 1.5rem 0;
    border-bottom: 1px solid #eee;
  }

  .site-title {
    text-decoration: none;
    color: #333 !important;        /* This kills the purple color */
    font-weight: 700;
    font-size: 1.4rem;
  }

  .site-nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 2rem;
  }

  .site-nav a {
    text-decoration: none;
    color: #333;
    font-weight: 500;
    font-size: 1.1rem;
    transition: color 0.2s;
  }

  .site-nav a:hover {
    color: #00274c;
  }
</style>
