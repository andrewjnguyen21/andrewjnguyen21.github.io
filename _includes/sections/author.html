<section class="author-card" aria-labelledby="author-name">
  <img class="author-avatar" src="{{ site.owner.avatar | relative_url }}" alt="Portrait of {{ site.owner.name }}" />

  <div class="author-copy">
    <p class="eyebrow">Robotics · Research · Engineering</p>
    <h1 id="author-name">{{ site.owner.name }}</h1>
    <p class="author-bio">I’m a fourth-year undergraduate at the University of Michigan pursuing B.S. degrees in Robotics and Computer Science, expected May 2027. </p>
    <p class="author-bio">Currently applying to MS/PhD programs in Robotics.</p>

    <nav class="social-links" aria-label="Contact and profiles">
      <a href="mailto:{{ site.owner.email }}">Email</a>
      <a href="https://github.com/{{ site.owner.github }}" rel="me">GitHub</a>
      <a href="https://linkedin.com/in/{{ site.owner.linkedin }}" rel="me">LinkedIn</a>
    </nav>
  </div>
</section>
