<div id="author" style="display: flex; align-items: center; gap: 1.5rem; text-align: left; justify-content: center; padding-bottom: 2rem; margin-bottom: 2rem; border-bottom: 1px solid #e0e0e0;">

  <!-- Left: avatar -->
  <img src="{{ site.owner.avatar | relative_url }}" alt="{{ site.owner.name }}" style="width: 150px; border-radius: 50%; flex-shrink: 0;" />

  <!-- Right: name, bio, buttons -->
  <div>
    <h1 style="margin: 0 0 0.5rem 0;">{{ site.owner.name }}</h1>

    <p style="margin: 0 0 1rem 0;">
      I am a third-year Undergraduate student studying Robotics & Computer Science at the University of Michigan
    </p>

    <div class="social-links">
      <a href="mailto:{{ site.owner.email }}">Email</a>
      <a href="http://github.com/{{ site.owner.github }}">GitHub</a>
      <a href="http://linkedin.com/in/{{ site.owner.linkedin }}">LinkedIn</a>
    </div>
  </div>

</div>

<style>
    #author .social-links a {
        display: inline-block;
        padding: 0.4rem 0.9rem;
        background-color: #2d2d2d;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 0.85rem;
        transition: background-color 0.2s ease;
    }
</style>
